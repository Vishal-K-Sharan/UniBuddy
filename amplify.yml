version: 1
applications:
  - appRoot: artifacts/consigliere
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm use 24
            - npm install -g pnpm@10.14.0
            - pnpm install --frozen-lockfile
        build:
          commands:
            - pnpm --filter @workspace/consigliere run build
      artifacts:
        baseDirectory: artifacts/consigliere/dist/public
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .pnpm-store/**/*
